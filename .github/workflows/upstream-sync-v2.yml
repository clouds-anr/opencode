# Full upstream sync — thin wrapper around sync-upstream.sh.
#
# This replaces the old threshold-based sync. It runs nightly and can also be
# triggered manually. All real logic lives in .github/scripts/sync-upstream.sh,
# so it runs and is tested locally exactly as it runs here:
#   bash .github/scripts/sync-upstream.sh            # dry run
#   bash .github/scripts/sync-upstream.sh --push     # push
#
# Safety model:
#   * Only ever opens/updates ONE PR from sync/upstream -> dev. NEVER pushes dev,
#     NEVER merges. A human always merges.
#   * Manual and nightly runs cannot clobber each other:
#       - `concurrency` serializes runs (no two at once).
#       - a pre-flight guard inspects the sync branch for unexpected manual commits.
#         If any are found the run fails loudly instead of overwriting human work.
#       - If an open sync PR exists the run updates it in place (no skip).
#   * `dry_run` (manual only) resolves+validates+reports without pushing.
name: upstream-sync-v2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve & validate only; do not push or open a PR"
        type: boolean
        default: false
  schedule:
    # GitHub cron is UTC. 04:00 UTC ≈ 11 PM US Central (CDT; 10 PM during CST).
    - cron: "0 4 * * *"

permissions:
  contents: write
  pull-requests: write

# Shared group across manual + scheduled runs so they never execute together.
# cancel-in-progress:false => a second run queues behind the first instead of
# cancelling it, and the in-flight-PR guard below stops it from overwriting.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  TARGET_BRANCH: dev
  SYNC_BRANCH: sync/upstream
  # true only when manually dispatched with dry_run checked; scheduled runs are live.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
  # Disable husky in CI: the script runs its own typecheck gate and must be able to
  # push the review branch even when typecheck fails. Otherwise the pre-push hook
  # (full turbo typecheck) would block the workflow's own push.
  HUSKY: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      # Guard: fetch the remote sync branch and check for unexpected manual commits.
      # Bot-generated commits are either upstream merge commits or chore(sync): ones;
      # anything else indicates a human pushed to the branch and the run must halt to
      # avoid destroying that work.  An open PR is NOT a reason to skip — the run will
      # update the existing PR in place.
      # NOTE: dry_run bypasses this guard (a dry run never pushes, so there is nothing
      # to overwrite). Do not treat a passing dry run as proof that a live run would
      # safely update the sync branch.
      - name: Check for manual divergence on sync branch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$SYNC_BRANCH" 2>/dev/null || true
          if git rev-parse "origin/$SYNC_BRANCH" >/dev/null 2>&1 && [ "$DRY_RUN" != "true" ]; then
            ahead="$(git rev-list --count "origin/$TARGET_BRANCH..origin/$SYNC_BRANCH" 2>/dev/null || echo 0)"
            if [ "$ahead" -gt 0 ]; then
              # --first-parent: only check commits directly on the branch,
              # not all commits reachable through upstream merge parents.
              # Allow: merge commits and any conventional-commit with scope
              # "(sync)" — e.g. chore(sync):, fix(sync):, test(sync):.
              unexpected="$(git log --first-parent --oneline "origin/$TARGET_BRANCH..origin/$SYNC_BRANCH" \
                | grep -vE "^[0-9a-f]+ (Merge |\w+\(sync\):)" || true)"
              if [ -n "$unexpected" ]; then
                echo "::error::sync/upstream has unexpected commits that would be overwritten by a fresh sync."
                echo "Resolve, incorporate, or close the open PR before running the automated sync."
                echo "Unexpected commits:"
                echo "$unexpected"
                exit 1
              fi
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # App-token committer so the branch push is allowed to include upstream's
      # workflow file changes (the plain GITHUB_TOKEN cannot push to .github/workflows).
      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Run sync
        id: sync
        run: |
          # setup-bun runs `bun install`, which regenerates bun.lock and dirties the
          # tracked tree. Discard that so the script's preflight sees a clean tree;
          # the script reconciles and commits bun.lock itself during the run.
          git checkout -- .
          if [ "$DRY_RUN" != "true" ]; then
            SYNC_GITHUB_OUTPUT="$GITHUB_OUTPUT" bash .github/scripts/sync-upstream.sh --push
          else
            SYNC_GITHUB_OUTPUT="$GITHUB_OUTPUT" bash .github/scripts/sync-upstream.sh
          fi

      - name: Open / update the sync PR
        if: ${{ env.DRY_RUN != 'true' && steps.sync.outputs.result == 'ok' }}
        env:
          # Use the committer's App token (can create PRs); the default GITHUB_TOKEN
          # may be blocked from creating PRs by org policy. Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ steps.committer.outputs.token || github.token }}
          SAFE: ${{ steps.sync.outputs.safe_to_push }}
          ESCALATED: ${{ steps.sync.outputs.escalated }}
          TYPECHECK: ${{ steps.sync.outputs.typecheck }}
          TEST: ${{ steps.sync.outputs.test }}
          COMMITS_BEHIND: ${{ steps.sync.outputs.commits_behind }}
          HEAD_SHA: ${{ steps.sync.outputs.head }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%d)"

          if [ "$SAFE" = "yes" ]; then
            title="chore(sync): upstream sync $date — ready for review"
            body=$(cat <<EOF
          Automated full upstream sync ($date) — merged \`$COMMITS_BEHIND\` upstream commit(s).

          Validation passed ✅ (typecheck: $TYPECHECK, tests: $TEST). Conflicts were resolved
          automatically via remembered resolutions (git rerere) and conflict-rules.conf.

          Tip of branch: \`$HEAD_SHA\`. Ready for review and merge into \`$TARGET_BRANCH\`.
          EOF
          )
            label="upstream-sync"
          else
            title="chore(sync): upstream sync $date — NEEDS MANUAL REVIEW"
            body=$(cat <<EOF
          Automated full upstream sync ($date) needs a human.

          Attempted to merge \`$COMMITS_BEHIND\` upstream commit(s).

          - Typecheck (full workspace): **$TYPECHECK**
          - Unit tests: **$TEST**
          - Files left with conflict markers (textual): \`$ESCALATED\`

          A \`failed\` typecheck means a *semantic* break — code that merged cleanly
          but no longer compiles (an ANR file using an upstream API that changed).
          A \`failed\` tests result means a *behavioral* break — code that compiles
          but no longer behaves correctly. Check the workflow log's "Validate" steps
          for the exact errors; those files have NO conflict markers.

          To finish: resolve the conflict file(s) above and fix any typecheck errors
          **locally with rerere enabled** so the fix is remembered next time:

          \`\`\`
          git fetch origin $SYNC_BRANCH && git checkout $SYNC_BRANCH
          git config rerere.enabled true
          # edit the escalated file(s), then:
          git add -A && git commit && bun install && git push --force-with-lease
          \`\`\`

          Tip of branch: \`$HEAD_SHA\`.
          EOF
          )
            label="needs-manual-review"
          fi

          existing="$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" \
            --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body" --add-label "$label" || true
            echo "Updated PR #$existing"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" \
              --title "$title" --body "$body" --label "$label" || \
            gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" \
              --title "$title" --body "$body"
          fi
