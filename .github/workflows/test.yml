name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: blacksmith-4vcpu-ubuntu-2404
          - name: windows
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: blacksmith-4vcpu-ubuntu-2404
          - name: windows
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  # Binary smoke + config-layer validation: prove the *compiled* CLI actually
  # launches AND that the committed .opencode config loads against it — not just
  # that the source typechecks/tests. Catches "built executable ships broken" and
  # config/schema drift (clouds-anr/opencode#307, phases 1 & 2). Linux-only for
  # now; expand to a macOS/Windows matrix once the flow is proven.
  cli-smoke:
    name: cli-smoke + config (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # --single builds a single native binary for the current platform only
      # (no cross-compile matrix), which is all the smoke test needs.
      - name: Build CLI binary
        timeout-minutes: 20
        run: bun packages/opencode/script/build.ts --single

      # Offline checks only — no auth, no provider calls, no network-dependent
      # prompts. --version and --help exercise startup and command wiring.
      - name: Smoke test the binary
        env:
          OPENCODE_DISABLE_SHARE: "1"
        run: |
          set -euo pipefail
          bin="$(find packages/opencode/dist -maxdepth 3 -type f -name opencode | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::built opencode binary not found under packages/opencode/dist"
            ls -R packages/opencode/dist || true
            exit 1
          fi
          chmod +x "$bin"
          echo "Binary: $bin"

          echo "== opencode --version =="
          version="$("$bin" --version)"
          echo "$version"
          echo "$version" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::--version did not print a semver-like string"; exit 1; }

          # --help prints to stderr (and exits 0), so capture both streams.
          echo "== opencode --help =="
          help="$("$bin" --help 2>&1)"
          echo "$help"
          echo "$help" | grep -qi "opencode" \
            || { echo "::error::--help produced no recognizable output"; exit 1; }

          echo "CLI smoke test passed."

      # Phase 2 (#307): validate the .opencode config layer loads against the
      # built binary — opencode.jsonc, agents, commands, and skills must parse
      # and pass schema with no errors. OPENCODE_FLAVOR=oss + --pure keep this
      # fully offline: otherwise .opencode/.env* auto-enables ANR mode (browser/
      # AWS auth + an interactive env-file picker), and plugin loading could hit
      # the network on a fresh checkout. This validates config parse + schema,
      # not the ANR auth runtime or external plugin modules.
      - name: Validate .opencode config layer
        env:
          OPENCODE_FLAVOR: oss
          OPENCODE_DISABLE_SHARE: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "1"
        run: |
          set -euo pipefail
          bin="$(find packages/opencode/dist -maxdepth 3 -type f -name opencode | head -1)"
          [ -n "$bin" ] || { echo "::error::built opencode binary not found"; exit 1; }

          echo "== opencode.jsonc + resolved schema (agents/commands/mcp) =="
          "$bin" debug config --pure | bun -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const k of ["agent", "command"]) {
              if (!(k in j)) { console.error("::error::resolved config missing key: " + k); process.exit(1); }
            }
            const cmds = Object.keys(j.command || {}).length;
            if (cmds === 0) { console.error("::error::no commands resolved from .opencode/command"); process.exit(1); }
            console.log(`config OK — ${Object.keys(j.agent).length} agents, ${cmds} commands`);
          '

          echo "== agents load (.opencode/agent/*.md via Agent service) =="
          agents="$("$bin" agent list --pure)"
          [ -n "$agents" ] || { echo "::error::agent list produced no output"; exit 1; }
          echo "agents OK"

          echo "== skills load (.opencode/skills/* via Skill service) =="
          "$bin" debug skill --pure | bun -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!Array.isArray(j) || j.length === 0) { console.error("::error::no skills loaded"); process.exit(1); }
            console.log(`skills OK — ${j.length} loaded`);
          '

          echo "Config-layer validation passed."
